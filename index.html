<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact form</title>
    <link rel="stylesheet" href="contact.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // https://dashboard.emailjs.com/admin/account
            emailjs.init({
              publicKey: "FAguBrdSI2g9jwAAx",
            });
        })();
    </script>
    <script type="text/javascript">
        window.onload = function() {
            document.getElementById('contactForm').addEventListener('submit', function(event) {
                event.preventDefault();
                // these IDs from the previous steps
                emailjs.sendForm('service_yuvy3i7', 'template_l31bnmt', this)
                    .then(() => {
                        console.log('SUCCESS!');
                    }, (error) => {
                        console.log('FAILED...', error);
                    });
            });
        }
    </script>
</head>
<body>
    <div> 
        <form id="contactForm">
            <input type="hidden" name="contact_number" value="697483">

           <h2 class="H1">Contact Us</h2>
           <label>Name</label><br>
           <input class="ka" type="text" name="user_name"><p></p>
           <label>Email</label> <br>
           <input class="ga" type="email" name="user_email"><p></p>
           <label>Message</label><br>
           <textarea name="massage"></textarea><p></p>
           <input class="ba" type="submit" value="SEND">
        </form>
    </div>
</body>
</html>
